name: yaqinda
description: "Yaqinda — mahalla doʻkonlaridan buyurtma (demo APK). Xaridor va doʻkon rejimi bitta ilovada."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
  # Figtree fonts are not bundled (no network access at build time).
  # Download the 5 weights into assets/fonts/ and uncomment to enable — see DECISIONS.md.
  # fonts:
  #   - family: Figtree
  #     fonts:
  #       - asset: assets/fonts/Figtree-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Figtree-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Figtree-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Figtree-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Figtree-ExtraBold.ttf
  #         weight: 800
